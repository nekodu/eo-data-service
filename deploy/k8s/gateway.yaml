# kind has no load balancer; a ClusterIP service lets the Gateway become Programmed
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cluster-ip
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: cluster-ip
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eods
  namespace: eods
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: eods
spec:
  parentRefs: [{name: eods}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/}
      backendRefs:
        - {name: eods-api, port: 8000}
---
# only the token endpoint of the realm is public; the admin console stays inside the cluster
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: token
  namespace: eods
spec:
  parentRefs: [{name: eods}]
  rules:
    - matches:
        - path: {type: Exact, value: /realms/eods/protocol/openid-connect/token}
          method: POST
      backendRefs:
        - {name: keycloak, port: 8080}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: api-jwt
  namespace: eods
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: api}
  jwt:
    providers:
      - name: keycloak
        issuer: http://keycloak.eods.svc.cluster.local:8080/realms/eods
        audiences: [eods-api]
        remoteJWKS:
          uri: http://keycloak.eods.svc.cluster.local:8080/realms/eods/protocol/openid-connect/certs
        claimToHeaders:
          - {claim: azp, header: x-client-id}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: api-limits
  namespace: eods
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: api}
  rateLimit:
    type: Local
    local:
      rules:
        - limit: {requests: 120, unit: Minute}
  timeout:
    http:
      requestTimeout: 30s
