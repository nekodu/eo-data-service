# pulls the newest cloud-mask slots every 30 minutes and appends them to the cube
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eods-ingest
  namespace: eods
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels: {app: eods-ingest}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ingest
              image: eods:dev
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  eods fetch --start "$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M)"
                  --end "$(date -u +%Y-%m-%dT%H:%M)" --raw /data/raw &&
                  eods build --raw /data/raw --out /data/cube.zarr --append
              envFrom:
                - secretRef: {name: eumetsat-credentials}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits: {memory: 2Gi}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
                - {name: home, mountPath: /home/app}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: eods-data}
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
